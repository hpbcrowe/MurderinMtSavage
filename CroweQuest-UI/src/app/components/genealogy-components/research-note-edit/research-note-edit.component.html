<div class="container mt-4">
  <div class="d-flex justify-content-center">
    <h1 class="display-4 mt-5">{{ isNew() ? 'Create' : 'Edit' }} Research Note</h1>
  </div>

  <form [formGroup]="researchNoteForm" (ngSubmit)="onSubmit()">
    <div class="form-group"><label>Title</label><input class="form-control" formControlName="title" /></div>
    <div class="form-group">
      <label>Ancestor Profile</label>
      <select class="form-control" formControlName="ancestorProfileId">
        <option [ngValue]="null">None</option>
        <option *ngFor="let ancestor of ancestorProfiles" [ngValue]="ancestor.ancestorProfileId">{{ ancestor.firstName }} {{ ancestor.lastName }}</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group col-md-4"><label>Status</label><input class="form-control" formControlName="status" /></div>
      <div class="form-group col-md-4"><label>Confidence Level</label><input class="form-control" formControlName="confidenceLevel" /></div>
      <div class="form-group col-md-4"><label>Tags</label><input class="form-control" formControlName="tags" /></div>
    </div>
    <div class="form-group"><label>Content</label><textarea class="form-control" rows="12" formControlName="content"></textarea></div>
    <button class="btn bg-primary text-light" [disabled]="!researchNoteForm.valid && researchNoteForm.pristine">Save</button>
  </form>
</div>
