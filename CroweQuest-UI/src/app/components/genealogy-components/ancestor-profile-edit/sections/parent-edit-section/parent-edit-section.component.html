<div class="form-group">
  <label>Father</label>
  <div class="d-flex align-items-center">
    <select class="form-control" formControlName="fatherAncestorProfileId">
      <option [ngValue]="null">Unknown</option>
      <option *ngFor="let ancestor of eligibleFatherAncestors" [ngValue]="ancestor.ancestorProfileId">
        {{ ancestor.firstName }} {{ ancestor.middleName }} {{ ancestor.lastName }}
      </option>
    </select>
    <button
      type="button"
      class="btn btn-outline-danger ml-2"
      [disabled]="!ancestorProfileForm.get('fatherAncestorProfileId')?.value"
      (click)="clearFatherSelection.emit()"
    >
      Remove
    </button>
  </div>
  <small class="form-text text-muted">Father must be a male ancestor.</small>

  <div class="input-group mt-2" *ngIf="!hasSelectedFather()">
    <input
      class="form-control"
      [ngModel]="newFatherName"
      (ngModelChange)="newFatherNameChange.emit($event)"
      [ngModelOptions]="{ standalone: true }"
      placeholder="Enter father full name"
    />
    <div class="input-group-append">
      <button
        type="button"
        class="btn"
        [ngClass]="getFatherCreateButtonHighlighted() ? 'btn-warning text-dark' : 'btn-outline-primary'"
        [disabled]="isCreatingFather"
        (click)="createAndAssignFather.emit()"
      >
        {{ isCreatingFather ? 'Creating...' : 'Create father ancestor' }}
      </button>
    </div>
  </div>

  <div class="alert alert-info mt-2 mb-0" *ngIf="recentlyCreatedFather as father">
    Father ancestor created with partial details: <strong>{{ father.firstName }} {{ father.middleName }} {{ father.lastName }}</strong>.
    <button type="button" class="btn btn-sm btn-outline-primary ml-2" (click)="openAncestorProfile.emit(father.ancestorProfileId)">Open profile in new tab</button>
  </div>
</div>
