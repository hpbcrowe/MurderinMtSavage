<div class="container">
  <div class="row">
    <div class="col-md-6 offset-md-3 mt-5">
      <h3 class="text-dark">Login</h3>
      <p class="text-dark">
        Get to your dashboard and start sharing your research
      </p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <input
            type="text"
            [ngClass]="{
              'is-invalid': hasErrors('username') && isTouched('username'),
              'is-valid': !hasErrors('username') && isTouched('username')
            }"
            class="form-control form-control-lg"
            formControlName="username"
            placeholder="Username"
          />

          <div
            *ngIf="hasError('username', 'required')"
            class="invalid-feedback"
          >
            Username is Required
          </div>

          <div
            *ngIf="
              hasError('username', 'minlength') ||
              hasError('username', 'maxlength')
            "
            class="invalid-feedback"
          >
            Must Be Between 5-20 Characters
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-group input-group-lg">
            <input
              [type]="showPassword ? 'text' : 'password'"
              [ngClass]="{
                'is-invalid': hasErrors('password') && isTouched('password'),
                'is-valid': !hasErrors('password') && isTouched('password')
              }"
              class="form-control"
              formControlName="password"
              placeholder="Password"
              id="password"
            />
            <div class="input-group-append">
              <button
                type="button"
                class="btn btn-outline-secondary login-password-toggle"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                [attr.title]="showPassword ? 'Hide password' : 'Show password'"
              >
                <i [ngClass]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
              </button>
            </div>
          </div>

          <div
            *ngIf="hasError('password', 'required')"
            class="invalid-feedback"
          >
            Password is Required
          </div>

          <div
            *ngIf="
              hasError('password', 'minlength') ||
              hasError('password', 'maxlength')
            "
            class="invalid-feedback"
          >
            Must Be Between 10-50 Characters
          </div>
        </div>

        <div *ngIf="loginError" class="alert alert-danger mt-3" role="alert">
          {{ loginError }}
        </div>

        <button
          class="btn btn-block mb-3 bg-primary text-light"
          [disabled]="!loginForm.valid"
        >
          Login
        </button>

        <div class="text-right mb-3">
          <a routerLink="/reset-password">Forgot your password?</a>
        </div>
      </form>
    </div>
  </div>
</div>
