<div class="container">
  <div class="d-flex justify-content-center">
    <h1 class="display-4 mt-5">{{ isNew() ? "Create" : "Edit" }} Blog</h1>
  </div>

  <a
    *ngIf="!isNew()"
    class="btn btn-primary mb-2 p-1"
    routerLink="/blogs/{{ blogForm.get('blogId')?.value }}"
    >Preview Blog / Journal Entry</a
  >

  <form [formGroup]="blogForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="ancestorProfileId">Ancestor Profile</label>
        <select class="form-control form-control-lg" formControlName="ancestorProfileId" id="ancestorProfileId">
          <option [ngValue]="null">None</option>
          <option *ngFor="let ancestor of ancestorProfiles" [ngValue]="ancestor.ancestorProfileId">
            {{ ancestor.firstName }} {{ ancestor.lastName }}
          </option>
        </select>
      </div>

      <div class="form-group col-md-6">
        <label for="sourceId">Source</label>
        <select class="form-control form-control-lg" formControlName="sourceId" id="sourceId">
          <option [ngValue]="null">None</option>
          <option *ngFor="let source of sources" [ngValue]="source.sourceId">
            {{ source.title }}
          </option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group col-md-4"><label>Ancestor Name</label><input class="form-control form-control-lg" formControlName="ancestorName" /></div>
      <div class="form-group col-md-4"><label>Record Type</label><input class="form-control form-control-lg" formControlName="recordType" /></div>
      <div class="form-group col-md-4"><label>Location</label><input class="form-control form-control-lg" formControlName="location" /></div>
    </div>

    <div class="form-row">
      <div class="form-group col-md-4"><label>Family Branch</label><input class="form-control form-control-lg" formControlName="familyBranch" /></div>
      <div class="form-group col-md-4"><label>Tags</label><input class="form-control form-control-lg" formControlName="tags" placeholder="Crowe, Utah, Census" /></div>
      <div class="form-group col-md-4"><label>Confidence</label><input class="form-control form-control-lg" formControlName="confidenceLevel" /></div>
    </div>

    <div class="form-group">
      <label for="researchStatus">Research Status</label>
      <input class="form-control form-control-lg" formControlName="researchStatus" id="researchStatus" />
    </div>

    <div class="form-group">
      <label for="photo">Photo</label>

      <input
        formControlName="photoDescription"
        [typeahead]="userPhotos"
        typeaheadOptionField="description"
        [typeaheadScrollable]="true"
        [typeaheadOptionsInScrollableView]="5"
        (typeaheadOnSelect)="onSelect($event)"
        placeholder="Choose optional photo"
        class="form-control form-control-lg"
        id="photo"
      />
    </div>

    <div class="form-group">
      <label for="title">Title</label>
      <input
        type="text"
        [ngClass]="{
          'is-invalid': hasErrors('title') && isTouched('title'),
          'is-valid': !hasErrors('title') && isTouched('title')
        }"
        class="form-control form-control-lg"
        formControlName="title"
        placeholder="Enter The Title of Your Post"
        id="title"
      />

      <div *ngIf="hasError('title', 'required')" class="invalid-feedback">
        A Title is required
      </div>

      <div
        *ngIf="hasError('title', 'minlength') || hasError('title', 'maxlength')"
        class="invalid-feedback"
      >
        Must be between 10-20 characters
      </div>
    </div>

    <div class="form-group">
      <label for="content">Content</label>
      <textarea
        [ngClass]="{
          'is-invalid': hasErrors('content') && isTouched('content'),
          'is-valid': !hasErrors('content') && isTouched('content')
        }"
        class="form-control form-control-lg"
        formControlName="content"
        id="content"
        rows="20"
      ></textarea>

      <div *ngIf="hasError('content', 'required')" class="invalid-feedback">
        Content is required
      </div>

      <div
        *ngIf="
          hasError('content', 'minlength') || hasError('content', 'maxlength')
        "
        class="invalid-feedback"
      >
        Must be between 50-5000 characters
      </div>
    </div>

    <button
      class="btn bg-primary text-light mr-2"
      [disabled]="!blogForm.valid && blogForm.pristine"
    >
      Save
    </button>

    <button
      class="btn btn-danger text-light"
      *ngIf="!!getPhoto(blogForm.get('photoId')?.value)"
      (click)="detachPhoto()"
    >
      Detach Photo
    </button>
  </form>
</div>
